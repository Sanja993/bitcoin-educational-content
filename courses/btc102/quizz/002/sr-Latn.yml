question: Šta je značajan primer Bitkoin Hard Fork-a?
answer: Bitcoin Cash (BCH)
wrong_answers:
  - Ethereum (ETH)
  - Litecoin (LTC)
  - Ripple (XRP)
explanation: |
  Bitkoin je prošao kroz nekoliko Hard Fork-ova tokom vremena, što je dovelo do različitih alternativnih verzija originalne valute. Značajni primeri ovih odstupanja uključuju Bitcoin Cash (BCH) i Bitcoin Satoshi Vision (BSV).
reviewed: false
