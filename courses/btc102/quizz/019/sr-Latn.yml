question: Koji je rizik povezan sa čuvanjem bitkoina na menjačnici?
answer: Platforma bi mogla bankrotirati, vaši bitkoini bi mogli biti konfiskovani, ili bi platforma mogla biti hakovana.
wrong_answers:
  - Platforma bi mogla povećati svoje naknade, vaši bitkoini bi mogli izgubiti vrednost ili bi platforma mogla biti hakovana.
  - Platforma bi mogla bankrotirati, vaši bitkoini bi mogli porasti u vrednosti, ili bi platforma mogla biti hakovana.
  - Platforma bi mogla bankrotirati, vaši bitkoini bi mogli biti konfiskovani, ili bi platforma mogla povećati svoje naknade.
explanation: |
  Skladištenje bitkoina na menjačnici nosi rizike kao što su bankrot platforme, konfiskacija vaših bitkoina ili hakovanje platforme. Zato je važno imati kontrolu nad vašim privatnim ključem.
