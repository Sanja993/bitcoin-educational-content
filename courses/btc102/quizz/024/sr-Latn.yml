question: Koja je važnost ostajanja skroman i diskretan u bitkoin investiciji?
answer: Izlažući se, postali biste potencijalna meta, povećavajući rizike za sebe i svoju porodicu.
wrong_answers:
  - Ostajući skroman i diskretan, možete izbeći privlačenje pažnje drugih investitora.
  - Ostajući skroman i diskretan, možete izbeći privlačenje pažnje bitkoin zajednice.
  - Ostajući skroman i diskretan, možete izbeći privlačenje pažnje medija.
explanation: |
  U bitkoin investiciji, važno je ostati skroman i diskretan jer
  izlaganjem sebe postajete potencijalna meta, povećavajući rizike
  za sebe i svoju porodicu.
