question: Koje su neke od uobičajenih grešaka koje početnici investitori prave kada ulaze u svet Bitkoina?
answer: Prekomerno ulaganje
wrong_answers:
  - Nedovoljno ulaganje
  - Ulaganje samo u bitkoin
  - Ne ulagati u bitkoin uopšte
explanation: |
  Jedna od uobičajenih grešaka koje početnici investitori prave kada ulaze u svet Bitkoina je prekomerno ulaganje, što znači ulaganje više novca nego što mogu priuštiti da izgube. Ovo može dovesti do finansijskih problema ako vrednost bitkoina opadne.
