question: Koja je uloga rudara u Bitcoin mreži?
answer: Da zabeleže propagirane transakcije u Bitkoin Blockchain-u
wrong_answers:
  - Da se kreiraju novi bitkoini
  - Da reguliše vrednost bitkoina
  - Da verifikuju identitet bitkoin korisnika 
explanation: |
  Rudari u Bitkoin mreži su odgovorni za beleženje transakcija
  koje su propagirane kroz mrežu u Bitkoin Blockchain-u. Ovo osigurava
  konačnost transakcija.
